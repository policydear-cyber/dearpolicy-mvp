name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DEV_ACCOUNT_ID: 00000000-0000-0000-0000-000000000001
      MODEL_PRESET: ollama
      LLM_BASE_URL: http://localhost:11434/v1
      LLM_API_KEY: ci
      LLM_MODEL: ci
      EMBED_MODEL: ci
      EMBED_DIMENSIONS: "768"
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: System + database regression suite (PGlite, no live DB needed)
        run: npm run system:test

      - name: Claim-rule and contextual regression suite
        run: npm run claims:test

      - name: Build
        run: npm run build
