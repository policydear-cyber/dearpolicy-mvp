services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: dearpolicy
      POSTGRES_PASSWORD: dearpolicy
      POSTGRES_DB: dearpolicy
    ports:
      - "5432:5432"
    volumes:
      - dearpolicy_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dearpolicy"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dearpolicy_pg:
